<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc">
  <title id="title">Future Ready — Black Hills STEAM Showcase</title>
  <desc id="desc">A luminous orbital science mark beside the Future Ready name.</desc>
  <defs>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="17" result="blur"/>
      <feFlood flood-color="#72e8ff" flood-opacity=".38"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feFlood flood-color="#ffd36a" flood-opacity=".55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e8ff"/>
      <stop offset=".54" stop-color="#ff4f72"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
  </defs>

  <!-- Vector orbital mark: infinitely scalable and transparent. -->
  <g transform="translate(210 210)">
    <circle r="132" fill="#060a20" fill-opacity=".82" stroke="#72e8ff" stroke-width="9" filter="url(#cyanGlow)"/>
    <circle r="94" fill="none" stroke="#72e8ff" stroke-opacity=".2" stroke-width="3"/>
    <ellipse rx="166" ry="53" fill="none" stroke="url(#orbit)" stroke-width="10" transform="rotate(-24)"/>
    <circle cx="-151" cy="62" r="8" fill="#ff4f72"/>
    <circle cx="151" cy="-62" r="7" fill="#ffd36a"/>
    <circle r="46" fill="#ffd36a" filter="url(#sunGlow)"/>
    <path d="M-31 11C-12-16 14-27 35-17C23 11-5 30-31 11Z" fill="#ff8759" opacity=".72"/>
    <circle cx="-14" cy="-16" r="10" fill="#fff7ce" opacity=".82"/>
  </g>

  <g fill="#f8f9ff">
    <text x="430" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="17">FUTURE READY</text>
    <text x="438" y="284" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="39" font-weight="700" letter-spacing="14" fill="#dbe5fa">BLACK HILLS STEAM SHOWCASE</text>
  </g>
</svg>
